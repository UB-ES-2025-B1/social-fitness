name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test --silent
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B test -Dtest='!CucumberIntegrationTest'
      - name: Run backend BDD tests (Cucumber)
        working-directory: backend
        run: mvn -B test -Dtest=CucumberIntegrationTest

  bdd-integration:
    name: BDD Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Start backend server
        working-directory: backend
        run: |
          nohup mvn spring-boot:run -Dspring-boot.run.profiles=test > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend starting... Waiting for health check"
          
          # Wait up to 120 seconds for backend to be ready
          for i in {1..60}; do
            if curl -f -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✓ Backend is ready!"
              curl -s http://localhost:8080/actuator/health
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend failed to start in time"
              cat backend.log
              exit 1
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
      
      - name: Run frontend BDD tests (Cucumber)
        working-directory: frontend
        run: npm run test:bdd
        env:
          API_BASE_URL: http://localhost:8080
      
      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
