name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests with coverage
        run: npm run coverage
        working-directory: frontend
      - name: Add frontend coverage to summary
        if: always()
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          
          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          const coverageSummaryPath = path.join(process.cwd(), 'coverage', 'coverage-summary.json')
          
          if (!summaryPath) process.exit(0)
          if (!fs.existsSync(coverageSummaryPath)) {
            fs.appendFileSync(summaryPath, '### Cobertura Frontend (Vitest)\n\nNo se encontro `coverage/coverage-summary.json`.\n')
            process.exit(0)
          }
          
          const report = JSON.parse(fs.readFileSync(coverageSummaryPath, 'utf8'))
          const total = report.total

          const bar = (pct, width = 12) => {
            const ratio = Math.max(0, Math.min(1, pct / 100))
            const filled = Math.round(ratio * width)
            return '█'.repeat(filled) + '░'.repeat(width - filled)
          }

          const row = (label, metric) =>
            `| ${label} | ${metric.pct}% | ${bar(metric.pct)} | ${metric.covered}/${metric.total} |`
          
          const markdown =
            '### Cobertura Frontend (Vitest)\n\n' +
            '| Métrica | % | Barra | Cubierto/Total |\n' +
            '|---|---:|:---:|---:|\n' +
            row('Statements', total.statements) + '\n' +
            row('Branches', total.branches) + '\n' +
            row('Functions', total.functions) + '\n' +
            row('Lines', total.lines) + '\n\n'
          
          fs.appendFileSync(summaryPath, markdown)
          NODE
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Run backend tests with coverage (JaCoCo + Cucumber)
        working-directory: backend
        run: ./mvnw -B clean verify
      - name: Add backend coverage to summary
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
            raise SystemExit(0)
          
          jacoco_xml = Path("target/site/jacoco/jacoco.xml")
          if not jacoco_xml.exists():
            with open(summary_path, "a", encoding="utf-8") as f:
              f.write("### Cobertura Backend (JaCoCo)\n\nNo se encontro `target/site/jacoco/jacoco.xml`.\n")
            raise SystemExit(0)
          
          root = ET.parse(jacoco_xml).getroot()
          counters = {}
          for c in root.findall("counter"):
            counters[c.attrib["type"]] = {
              "missed": int(c.attrib["missed"]),
              "covered": int(c.attrib["covered"]),
            }
          
          def pct(covered: int, missed: int) -> float:
            total = covered + missed
            return 0.0 if total == 0 else (covered * 100.0 / total)

          def bar(percent: float, width: int = 12) -> str:
            ratio = max(0.0, min(1.0, percent / 100.0))
            filled = int(round(ratio * width))
            return "█" * filled + "░" * (width - filled)
          
          def row(label: str, key: str) -> str:
            c = counters.get(key)
            if not c:
              return f"| {label} | - | - | - |"
            covered = c["covered"]
            missed = c["missed"]
            total = covered + missed
            percent = pct(covered, missed)
            return f"| {label} | {percent:.1f}% | {bar(percent)} | {covered}/{total} |"
          
          markdown = (
            "### Cobertura Backend (JaCoCo)\n\n"
            "| Métrica | % | Barra | Cubierto/Total |\n"
            "|---|---:|:---:|---:|\n"
            + row("Instructions", "INSTRUCTION") + "\n"
            + row("Branches", "BRANCH") + "\n"
            + row("Lines", "LINE") + "\n"
            + row("Methods", "METHOD") + "\n"
            + row("Classes", "CLASS") + "\n\n"
          )
          
          with open(summary_path, "a", encoding="utf-8") as f:
            f.write(markdown)
          PY
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco
            backend/target/cucumber-reports
            backend/target/surefire-reports
          if-no-files-found: ignore

  bdd-integration:
    name: BDD Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Start backend server
        working-directory: backend
        run: |
          nohup ./mvnw -B -Dspring-boot.run.profiles=test spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend starting... Waiting for health check"
          
          # Wait up to 120 seconds for backend to be ready
          for i in {1..60}; do
            if curl -f -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✓ Backend is ready!"
              curl -s http://localhost:8080/actuator/health
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend failed to start in time"
              cat backend.log
              exit 1
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
      
      - name: Run frontend BDD tests (Cucumber)
        working-directory: frontend
        run: npm run cucumber:html
        env:
          API_BASE_URL: http://localhost:8080
      
      - name: Upload frontend BDD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bdd-report
          path: frontend/cucumber-report.html
          if-no-files-found: ignore
      
      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
