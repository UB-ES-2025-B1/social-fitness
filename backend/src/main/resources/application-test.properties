# CI/Test profile configuration
# Use H2 in-memory database instead of PostgreSQL for CI environment
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Disable PostgreSQL-specific features
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Dev security (for testing)
spring.security.user.name=dev
spring.security.user.password=dev1234
