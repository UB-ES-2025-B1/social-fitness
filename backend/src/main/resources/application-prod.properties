# El proveedor suele inyectar PORT; si no, usa 8080
server.port=${PORT:8080}

# DB de producción vía variables de entorno (no hardcodees secretos)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool básico
spring.datasource.hikari.maximum-pool-size=5

# JPA en prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# (Si añades Flyway)
spring.flyway.enabled=true

# CORS: lo leerá la CorsConfig
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://mi-app.vercel.app}
